  --ink:#2a145a; --paper:#fffaf0; --coral:#ff6f61; --teal:#17a2a8;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}

button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:4px solid var(--ink);outline-offset:4px}

/* top bar */
.top{width:100%;max-width:880px;display:flex;align-items:center;gap:12px}
.avatar{width:clamp(64px,11vh,96px);aspect-ratio:1;border-radius:50%;border:4px solid var(--paper);box-shadow:0 4px 0 rgba(42,20,90,.25);flex:none;background:var(--paper)}
.bubble{position:relative;flex:1;min-width:0;background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:10px 16px;box-shadow:0 5px 0 rgba(42,20,90,.2)}
.bubble::before{content:"";position:absolute;left:-14px;top:50%;translate:0 -50%;border:10px solid transparent;border-right:14px solid var(--ink)}
.bubble::after{content:"";position:absolute;left:-9px;top:50%;translate:0 -50%;border:8px solid transparent;border-right:11px solid var(--paper)}
.q-es{font-family:var(--display);font-weight:800;font-size:clamp(22px,4.4vh,38px);line-height:1.05;text-wrap:balance}
.q-es b{color:var(--coral)}
.q-en{font-weight:800;font-size:clamp(14px,2.3vh,19px);opacity:.75}
.iconbtn{flex:none;width:52px;height:52px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);display:grid;place-items:center;box-shadow:0 4px 0 rgba(42,20,90,.25)}
.iconbtn svg{width:26px;height:26px}
.iconbtn:active{translate:0 3px;box-shadow:0 1px 0 rgba(42,20,90,.25)}

/* cards */
.cards{flex:1;min-height:0;width:100%;max-width:880px;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,2vw,24px);align-items:center}
.card{position:relative;aspect-ratio:3/4;max-height:100%;width:100%;max-width:100%;border-radius:28px;background:var(--paper);border:4px solid var(--ink);
  box-shadow:0 8px 0 rgba(42,20,90,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;transition:transform .15s}
.card svg{width:88%;height:auto;max-height:75%}
.card .lbl{font-family:var(--display);font-weight:800;font-size:clamp(18px,3.4vh,30px);line-height:1;min-height:1em;visibility:hidden}
.card.show .lbl{visibility:visible}
.card:active{transform:translateY(4px) scale(.98)}
.card.right{background:#fff3b0;border-color:var(--leaf)}
.card.wrong{animation:wiggle .45s}
.card.fade{opacity:.35}
@keyframes wiggle{20%{transform:rotate(-6deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(2deg)}}
.card.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.08)}}

/* star meter */
.meter{display:flex;gap:clamp(6px,1.6vw,14px);background:rgba(255,250,240,.85);border:3px solid var(--ink);border-radius:999px;padding:8px 16px}
.meter svg{width:clamp(30px,5.4vh,46px);height:auto}
.meter .on .fill{fill:var(--sun)}
.meter .fill{fill:#e8e1d3;transition:fill .3s}

/* overlay screens */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,2.6vh,24px);text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(circle at 50% 40%,rgba(255,250,240,.92),rgba(255,236,170,.94));z-index:5}
.title{font-family:var(--display);font-weight:800;font-size:clamp(38px,8vh,78px);line-height:.95;text-wrap:balance;color:var(--ink)}
.title span{color:var(--coral)}
.sub{font-weight:800;font-size:clamp(16px,2.6vh,22px);max-width:32ch}
.pals{display:flex;gap:10px}
.pals img{width:clamp(90px,17vh,150px);aspect-ratio:1;border-radius:50%;border:5px solid var(--paper);box-shadow:0 6px 0 rgba(42,20,90,.22)}
.play{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vh,44px);background:var(--coral);color:var(--paper);padding:10px 44px;border-radius:999px;border:4px solid var(--ink);box-shadow:0 7px 0 var(--ink)}
.play:active{translate:0 5px;box-shadow:0 2px 0 var(--ink)}
.tally{font-weight:800;font-size:15px;opacity:.7;font-variant-numeric:tabular-nums}
.grown{font-size:13px;opacity:.6;max-width:44ch}
canvas#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.tools{display:flex;gap:10px;flex:none}
@media (max-width:520px){ .tools{flex-direction:column;gap:8px} .iconbtn{width:42px;height:42px} .iconbtn svg{width:21px;height:21px} .avatar{width:58px} .bubble{padding:8px 12px} .q-es{font-size:clamp(20px,6.4vw,28px)} }
/* tall screens (phones held upright): three wide rows instead of three narrow columns */
@media (max-aspect-ratio:4/5){
  .cards{grid-template-columns:1fr;grid-template-rows:repeat(3,minmax(0,1fr));align-items:stretch;gap:12px}
  .card{aspect-ratio:auto;height:100%;flex-direction:row;gap:14px;border-radius:24px;padding:6px 16px}
  .card svg{width:auto;height:88%;max-height:88%;max-width:55%}
  .card .lbl{font-size:clamp(26px,8vw,40px)}
}
@media (prefers-reduced-motion:reduce){ .card.wrong,.card.pop{animation:none} }
</style>

let target=null, round=0, locked=false, soundOn=true, total=0;

/* ---------- pictures (simple drawn shapes, each with a smile) ---------- */
function face(cx,cy,s){return `<circle cx="${cx-9*s}" cy="${cy-4*s}" r="${3.4*s}" fill="#2a145a"/><circle cx="${cx+9*s}" cy="${cy-4*s}" r="${3.4*s}" fill="#2a145a"/>
 <path d="M${cx-9*s} ${cy+6*s} q${9*s} ${9*s} ${18*s} 0" fill="none" stroke="#2a145a" stroke-width="${3*s}" stroke-linecap="round"/>
 <circle cx="${cx-15*s}" cy="${cy+5*s}" r="${3.4*s}" fill="#ff8a8a" opacity=".6"/><circle cx="${cx+15*s}" cy="${cy+5*s}" r="${3.4*s}" fill="#ff8a8a" opacity=".6"/>`}
function sun(){let r='';for(let i=0;i<10;i++){r+=`<rect x="96" y="14" width="8" height="30" rx="4" fill="#ff9b00" transform="rotate(${i*36} 100 100)"/>`}
 return `<svg viewBox="0 0 200 200" aria-hidden="true">${r}<circle cx="100" cy="100" r="52" fill="#ffc928" stroke="#ff9b00" stroke-width="6"/>${face(100,104,1.4)}</svg>`}
function star(){const p=[];for(let i=0;i<10;i++){const R=i%2?38:84,a=Math.PI*i/5;p.push((100+R*Math.sin(a)).toFixed(1)+','+(108-R*Math.cos(a)).toFixed(1))}
 return `<svg viewBox="0 0 200 200" aria-hidden="true"><polygon points="${p.join(' ')}" fill="#ffd84a" stroke="#f0a400" stroke-width="7" stroke-linejoin="round"/>${face(100,112,1.25)}</svg>`}
function moon(){return `<svg viewBox="0 0 200 200" aria-hidden="true"><defs><mask id="mm"><rect width="200" height="200" fill="#fff"/><circle cx="132" cy="80" r="62" fill="#000"/></mask></defs>
 <circle cx="96" cy="104" r="72" fill="#ffe9a8" stroke="#e8b84a" stroke-width="6" mask="url(#mm)"/>
 <circle cx="58" cy="118" r="4.6" fill="#2a145a"/><path d="M48 136 q12 10 26 0" fill="none" stroke="#2a145a" stroke-width="4" stroke-linecap="round"/>
 <circle cx="150" cy="150" r="6" fill="#ffd84a"/><circle cx="170" cy="120" r="4" fill="#ffd84a"/></svg>`}
function flower(){let p='';for(let i=0;i<5;i++){p+=`<ellipse cx="100" cy="58" rx="34" ry="46" fill="#ff6f8e" stroke="#e0456a" stroke-width="5" transform="rotate(${i*72} 100 104)"/>`}
 return `<svg viewBox="0 0 200 200" aria-hidden="true">${p}<circle cx="100" cy="104" r="34" fill="#ffd84a" stroke="#f0a400" stroke-width="5"/>${face(100,106,.95)}</svg>`}

/* ---------- speech (browser voices; Spanish then English) ---------- */
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
function pick(lang){return voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith(lang)&&/female|samantha|paulina|monica|google/i.test(v.name))||voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith(lang))}
let seqId=0, cur=null;
function stopVoice(){seqId++; if(cur){try{cur.pause()}catch(e){}cur=null} try{speechSynthesis.cancel()}catch(e){}}
function speak(keys, fallback){
  if(!soundOn) return;
  stopVoice(); const id=seqId; let i=0;
  const next=()=>{ if(id!==seqId||i>=keys.length) return;
    const src=VOICE[keys[i++]]; if(!src){ return fail() }
    const a=new Audio(src); cur=a;
    a.onended=()=>setTimeout(next,220); a.onerror=fail;
    const p=a.play(); if(p&&p.catch) p.catch(fail);
  };
  let failed=false; const fail=()=>{ if(failed||id!==seqId) return; failed=true; say(fallback) };
  next();
}
function say(parts){ // device voice, used only if a clip can't play
  if(!soundOn) return;
  try{speechSynthesis.cancel();
    parts.forEach(([t,l])=>{const u=new SpeechSynthesisUtterance(t);u.lang=l==='es'?'es-MX':'en-US';const v=pick(l);if(v)u.voice=v;u.rate=.85;u.pitch=1.25;speechSynthesis.speak(u)});
  }catch(e){}
}

/* ---------- game ---------- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
let queue=[];
function nextTarget(){
  if(!queue.length) queue=shuffle(['sol','estrella','sol','estrella','luna','flor']);
  let t=queue.shift(); if(t===target&&queue.length){queue.push(t);t=queue.shift()} return t;
}
function buildMeter(){$('meter').innerHTML=Array.from({length:ROUNDS},(_,i)=>`<span class="${i<round?'on':''}"><svg viewBox="0 0 40 40"><polygon class="fill" points="20,2 25,15 39,15 28,24 32,38 20,30 8,38 12,24 1,15 15,15" stroke="#2a145a" stroke-width="2.4" stroke-linejoin="round"/></svg></span>`).join('')}
function ask(){
  const w=WORDS[target];
  $('qes').innerHTML=`¿Dónde está ${w.es.split(' ')[0]} <b>${w.bare}</b>?`;
  $('qen').textContent=`Where is ${w.en}?`;
  speak([`es_q_${target}`,`en_q_${target}`],[[`¿Dónde está ${w.es}?`,'es'],[`Where is ${w.en}?`,'en']]);
}
function newRound(){
  locked=false; target=nextTarget();
  const others=shuffle(KEYS.filter(k=>k!==target)).slice(0,2);
  const set=shuffle([target,...others]);
  $('cards').innerHTML=set.map(k=>`<button class="card" data-k="${k}" aria-label="${WORDS[k].bare}">${WORDS[k].pic()}<span class="lbl">${WORDS[k].bare}</span></button>`).join('');
  ask();
}
$('cards').addEventListener('click',e=>{
  const c=e.target.closest('.card'); if(!c||locked) return;
  const k=c.dataset.k, w=WORDS[k];
  if(k===target){
    locked=true; c.classList.add('right','show','pop');
    [...$('cards').children].forEach(x=>{if(x!==c)x.classList.add('fade')});
    round++; total++; save(); buildMeter(); burst(c);
    speak([`es_ok_${k}`,`en_ok_${k}`],[[`¡Sí! ¡${w.bare}!`,'es'],[`${w.enBare}!`,'en']]);
    setTimeout(()=>{ round>=ROUNDS?win():newRound() },2300);
  }else{
    c.classList.remove('wrong'); void c.offsetWidth; c.classList.add('wrong','show');
    speak([`es_name_${k}`,`en_no_${k}`],[[w.es,'es'],[`That's ${w.en}. Try again!`,'en']]);
    setTimeout(()=>c.classList.remove('show'),1600);
  }
});
function start(){$('start').hidden=true;$('win').hidden=true;round=0;buildMeter();newRound()}
function win(){
  $('winsub').textContent=`You found ${ROUNDS} stars! Total stars: ${total}`;
  $('win').hidden=false; speak(['es_win','en_win'],[['¡Muy bien!','es'],['Great job! You found all the stars!','en']]);
  bigBurst();
}
$('play').onclick=start; $('replay').onclick=start;
$('again').onclick=()=>target&&ask();
$('mute').onclick=()=>setSound(!soundOn);
function setSound(on){soundOn=on;$('mx').hidden=on;$('mute').setAttribute('aria-label',on?'Sound off':'Sound on');if(!on){stopVoice()}}

/* ---------- saved star total (YouTube save data, else this browser) ---------- */
function save(){
  try{localStorage.setItem('lunaStars',String(total))}catch(e){}
  try{yt&&yt.game.saveData(JSON.stringify({total}))}catch(e){}
}
async function load(){
  try{ if(yt){const s=await yt.game.loadData(); if(s){total=JSON.parse(s).total||0}} else {total=+(localStorage.getItem('lunaStars')||0)||0} }catch(e){total=0}
  $('tally').textContent= total? `Stars collected so far: ${total}` : '';
}

/* ---------- celebration sparkles ---------- */
const fx=$('fx'), ctx=fx.getContext('2d'); let parts=[], raf=0;
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
function size(){const r=fx.getBoundingClientRect(),d=devicePixelRatio||1;fx.width=r.width*d;fx.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',size); size();
function spawn(x,y,n){if(still)return;const cols=['#ffc928','#ff6f61','#17a2a8','#ff8fb1','#7ed957'];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*6;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,r:5+Math.random()*7,c:cols[i%cols.length],life:60+Math.random()*30,rot:Math.random()*6})}
  if(!raf)raf=requestAnimationFrame(tick)}
function starPath(x,y,r,rot){ctx.beginPath();for(let i=0;i<10;i++){const R=i%2?r*.45:r,a=rot+Math.PI*i/5;ctx.lineTo(x+R*Math.sin(a),y-R*Math.cos(a))}ctx.closePath()}
function tick(){const r=fx.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);
  parts=parts.filter(p=>p.life-->0);parts.forEach(p=>{p.vy+=.18;p.x+=p.vx;p.y+=p.vy;p.rot+=.08;ctx.globalAlpha=Math.min(1,p.life/30);ctx.fillStyle=p.c;starPath(p.x,p.y,p.r,p.rot);ctx.fill()});
  ctx.globalAlpha=1; raf=parts.length?requestAnimationFrame(tick):0}
function burst(el){const a=el.getBoundingClientRect(),b=fx.getBoundingClientRect();spawn(a.left-b.left+a.width/2,a.top-b.top+a.height/2,40)}
function bigBurst(){const b=fx.getBoundingClientRect();for(let i=0;i<4;i++)setTimeout(()=>spawn(b.width*(.2+.2*i),b.height*.35,45),i*220)}

/* ---------- Playables lifecycle ---------- */
buildMeter();
load();
requestAnimationFrame(()=>{ try{yt&&yt.game.firstFrameReady()}catch(e){} try{yt&&yt.game.gameReady()}catch(e){} });
if(yt){
  try{yt.system.onPause(()=>stopVoice())}catch(e){}
  try{yt.system.onResume(()=>{})}catch(e){}
  try{setSound(yt.system.isAudioEnabled()); yt.system.onAudioEnabledChange(on=>setSound(on))}catch(e){}
}
})();
</script>
